<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mati y las Mates</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#2b2358;background:linear-gradient(160deg,#ffe29f,#ffa99f 50%,#a18cd1) fixed;text-align:center;font-size:20px}
body.bg1{background:linear-gradient(160deg,#a1ffce,#faffd1 50%,#7ee8fa) fixed}
body.bg2{background:linear-gradient(160deg,#89f7fe,#66a6ff 60%,#c471f5) fixed}
body.bg3{background:linear-gradient(160deg,#1e1b4b,#4c1d95 60%,#be185d) fixed;color:#fff}
#app{max-width:820px;margin:0 auto;padding:64px 12px 28px}
h2{margin:8px 0;font-size:1.6em}
button{font:inherit;color:#2b2358;cursor:pointer}
button:focus-visible{outline:5px solid #ff4d8d;outline-offset:2px}
.btn{font-weight:800;font-size:1.25em;border:0;border-radius:22px;padding:14px 22px;margin:6px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);min-height:60px}
.btn:active,.opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.age{display:block;width:100%;max-width:420px;margin:10px auto;font-size:1.5em;animation:bob 3s ease-in-out infinite}
.age:nth-child(2){animation-delay:.3s}.age:nth-child(3){animation-delay:.6s}
.ib{border:0;background:#fff;border-radius:16px;font-size:1.5em;min-width:54px;min-height:54px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#tg{position:fixed;top:8px;right:8px;z-index:5;display:flex;gap:6px}
#tg button{border:0;background:#fff;border-radius:50%;width:48px;height:48px;font-size:1.4em;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mat{font-size:5.5em;display:inline-block;animation:bob 2.4s ease-in-out infinite;cursor:pointer;line-height:1.1}
.bubble{background:#fff;color:#2b2358;border-radius:24px;padding:12px 18px;margin:8px auto;max-width:360px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.top{display:flex;align-items:center;gap:8px;font-weight:800}
.bar{flex:1;height:18px;background:rgba(255,255,255,.7);border-radius:12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a3c,#ff4d8d);border-radius:12px;transition:width .5s}
.top span{background:#fff;color:#2b2358;border-radius:14px;padding:6px 10px}
.zone{min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.q{font-size:clamp(1.5em,6vw,2.4em);font-weight:800;margin:4px 0}
.vis{font-size:clamp(1.6em,7vw,2.6em);min-height:60px;margin:6px 0}
.big{font-size:1.3em;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.grp{display:inline-block;max-width:100%;line-height:1.3;font-size:.8em;margin:0 6px}
.grp i{display:inline-block;font-style:normal;animation:pop .4s both}.g5{display:inline-block;margin:2px 8px 2px 0}
.nb,.tag{background:#fff;color:#2b2358;border-radius:14px;padding:4px 14px;font-weight:800}
.hole{background:#ffe066;color:#2b2358;border:4px dashed #ff9a3c;border-radius:14px;padding:2px 14px;min-width:64px;display:inline-block;animation:bob 1.5s infinite}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:12px auto}
.opt{position:relative;font-weight:800;font-size:clamp(1.6em,7vw,2.3em);min-height:88px;border:0;border-radius:24px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);padding:8px}
.opt small{position:absolute;left:10px;top:6px;font-size:.45em;opacity:.55}
.opt.good{background:#6ee7a0;animation:pop .4s}.opt.good:after{content:" ✔";}
.opt.bad{background:#e5e1f0;opacity:.75;animation:shake .4s}.opt.bad:after{content:" ✖";}
.fb{min-height:32px;font-weight:800;font-size:1.2em;margin:6px}
.mon{font-size:5em}.mon.hit{animation:shake .5s}
.hearts{font-size:1.6em}
.track{position:relative;width:100%;height:96px;background:#1e1b4b;border-radius:20px;overflow:hidden;color:#fff}
.rk{position:absolute;top:22px;font-size:2.6em;transition:left .9s ease}
.stars{position:absolute;right:10px;bottom:6px;font-size:1.2em;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card2{border:0;border-radius:24px;padding:14px 8px;font-weight:800;font-size:1em;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);min-height:120px}
.card2 span{display:block;font-size:2.6em}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.mc{min-height:86px;border:0;border-radius:18px;font-size:1.5em;font-weight:800;background:#6c5ce7;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.mc.up{background:#fff;color:#2b2358}.mc.ok{background:#6ee7a0;color:#2b2358}.mc.ok:after{content:"✔"}
.box{background:#fff;color:#2b2358;border-radius:22px;padding:12px;margin:10px 0;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.pb{height:16px;background:#e5e1f0;border-radius:10px;overflow:hidden}.pb i{display:block;height:100%;background:#ff9a3c}
.med{display:inline-block;width:46%;margin:4px 1%;padding:8px;border-radius:16px;background:#fff;color:#2b2358;font-weight:700;font-size:.85em;vertical-align:top}
.med.lk{filter:grayscale(1);opacity:.5}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-200px);background:#ffe066;color:#2b2358;border-radius:20px;padding:12px 20px;font-weight:800;z-index:9;transition:transform .5s;box-shadow:0 6px 0 rgba(0,0,0,.2)}
#toast.on{transform:translate(-50%,0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:8}
.shoot{position:fixed;top:12%;left:100%;font-size:1.6em;z-index:1;animation:sh 1.6s linear forwards;pointer-events:none}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes sh{to{transform:translate(-120vw,60vh)}}
@media(max-width:480px){body{font-size:18px}.med{width:98%}}
</style></head><body>
<div id="tg"><button id="bs" onclick="tS()" aria-label="Sonido">🔊</button><button id="bv" onclick="tV()" aria-label="Voz">🗣️</button></div>
<div id="toast" role="status"></div><canvas id="cf"></canvas><main id="app"></main>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S={stars:0,best:0,games:0,ach:{},cat:{},time:0,ok:0,err:0,age:0,snd:1,voz:1,d:0,gd:{}},cur=null,tk=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('mati5')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('mati5',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* sonido y voz */
let AC;function tone(f,d,t=0,ty='sine'){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const snd={ok:()=>[523,659,784].forEach((f,i)=>tone(f,.2,i*.09)),bad:()=>tone(220,.3,0,'triangle'),win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.25,i*.12))};
function say(t){if(!S.voz||!window.speechSynthesis)return;try{if(/ = \?$/.test(t))t='¿Cuánto es '+t.replace(/ = \?$/,'')+'?';t=t.replace(/\+/g,' más ').replace(/[−-](?=\s)/g,' menos ').replace(/×/g,' por ').replace(/÷/g,' entre ').replace(/€/g,' euros');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function tS(){S.snd^=1;save();tg()}function tV(){S.voz^=1;if(!S.voz)try{speechSynthesis.cancel()}catch(e){}save();tg()}
function tg(){$('#bs').textContent=S.snd?'🔊':'🔇';$('#bv').textContent=S.voz?'🗣️':'🤐'}
/* confeti */
let pts=[],raf=0;const cv=$('#cf'),cx=cv.getContext('2d');
function confetti(n=90){cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<n;i++)pts.push({x:innerWidth/2,y:innerHeight/3,vx:R(-9,9),vy:R(-14,-3),c:P(['#ff4d8d','#ffd23f','#3ddc97','#4dabf7','#a78bfa']),s:R(6,12)});if(!raf)fr()}
function fr(){cx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});pts=pts.filter(p=>p.y<cv.height);raf=pts.length?requestAnimationFrame(fr):0}
setInterval(()=>{if(document.hidden)return;const e=document.createElement('div');e.className='shoot';e.textContent='🌠';e.style.top=R(5,40)+'%';document.body.appendChild(e);setTimeout(()=>e.remove(),1700)},11000);
/* mascota */
const EVO=[[0,'🤖'],[25,'👽'],[70,'🦄'],[150,'🐲']];
const mati=()=>EVO.filter(e=>S.stars>=e[0]).pop()[1];
const bg=()=>document.body.className='bg'+Math.min(3,Math.floor(S.stars/40));
/* logros */
const A=[['first','🥇','Primer reto',()=>S.games>=1],['r5','🔥','5 respuestas seguidas',()=>S.best>=5],['r10','⚡','10 seguidas',()=>S.best>=10],['sum','➕','Maestro de las sumas',()=>(S.cat.sum||[0])[0]>=30],['sp','🚀','Explorador espacial',()=>S.gd.space],['mon','🐉','Salvador del reino',()=>S.gd.mons],['g10','🎮','10 juegos completados',()=>S.games>=10],['rey','👑','Rey de los números',()=>S.stars>=100]];
function check(){A.forEach(a=>{if(!S.ach[a[0]]&&a[3]()){S.ach[a[0]]=1;save();const t=$('#toast');t.textContent=a[1]+' ¡Logro: '+a[2]+'!';t.classList.add('on');snd.win();confetti(60);setTimeout(()=>t.classList.remove('on'),2800)}})}
/* generadores */
const mx=(b,m)=>Math.max(3,Math.round(b*m));
const EM=[['🍎','manzanas','Cuántas'],['⭐','estrellas','Cuántas'],['🐸','ranas','Cuántas'],['🚗','coches','Cuántos'],['🐠','peces','Cuántos'],['🎈','globos','Cuántos'],['🍪','galletas','Cuántas']];
function opts(ans,fmt=String,sp=1){const s=new Set([ans]),D=[-3,-2,-1,1,2,3];if(ans>20*sp)D.push(-10,10);let t=0;while(s.size<4&&t++<60){const v=ans+P(D)*sp;if(v>=0)s.add(v)}let k=1;while(s.size<4)s.add(ans+k++*sp);return{o:sh([...s]).map(fmt),a:fmt(ans)}}
const mk=(t,v,h,c,ans,f,sp)=>({t,v,h,c,...opts(ans,f,sp)});
const em=(e,n)=>{let r='';for(let i=0;i<n;i++){if(i%5==0)r+=(i?'</span>':'')+'<span class=g5>';r+=`<i style="animation-delay:${i*.03}s">${e}</i>`}return`<div class=grp>${r}</span></div>`};
const hands=n=>(n>=5?'✋':'')+'☝️'.repeat(n%5);
const count=(x,y)=>Array.from({length:y},(_,i)=>x+i+1).join('… ');
function sum(a,m,hd){let x,y,z=0,h;if(a==0){x=R(1,7);y=R(1,Math.min(mx(5,m),10-x))}else if(a==1){x=R(5,mx(20,m));y=R(3,mx(12,m))}else if(R(0,1)){x=R(10,mx(60,m));y=R(10,mx(60,m));z=R(10,mx(60,m))}else{x=R(50,mx(400,m));y=R(30,mx(300,m))}
h=y<=10?`Empieza en ${x} y cuenta ${y} más: ${count(x,y)}`:'Suma primero las decenas y luego las unidades.';
return mk(`${x} + ${y}${z?' + '+z:''} = ?`,hd&&a==0?`<div class=big>${hands(x)}<b>+</b>${hands(y)}</div>`:'',h,'sum',x+y+z)}
function rest(a,m){let x,y;if(a==0){x=R(3,10);y=R(1,x-1)}else if(a==1){x=R(10,mx(30,m));y=R(2,Math.min(15,x-1))}else{x=R(100,mx(900,m));y=R(10,x-1)}
return mk(`${x} − ${y} = ?`,a==0?em('🍎',x):'',a==0?`Quita ${y} y cuenta las que quedan.`:'Resta poco a poco: primero las decenas, luego las unidades.','rest',x-y)}
function mul(a,m){const x=a==1?P([2,3,4,5,10]):R(3,12),y=a==1?R(1,10):R(3,mx(10,m));return mk(`${x} × ${y} = ?`,'',`Suma ${x} veces el ${y}, o ${y} veces el ${x}.`,'mul',x*y)}
function div(a,m){const y=a==1?P([2,3,4,5]):R(2,9),r=a==1?R(1,10):R(3,mx(12,m));return mk(`${y*r} ÷ ${y} = ?`,'',`¿Cuántas veces cabe el ${y}? Piensa: ${y} × ? = ${y*r}`,'div',r)}
function frac(){if(R(0,1)){const d=P([2,3,4,5]),r=R(2,10);return mk(`¿Cuánto es 1/${d} de ${d*r}?`,'',`Reparte ${d*r} en ${d} partes iguales.`,'prob',r)}const p=P([10,25,50]),t=P([20,40,80,100,200]);return mk(`¿Cuánto es el ${p}% de ${t}?`,'',p==50?'El 50% es la mitad.':p==25?'El 25% es la cuarta parte.':'El 10% es dividir entre 10.','prob',t*p/100)}
function comb(){const x=R(2,9),y=R(2,9),z=R(2,9);return R(0,1)?mk(`(${x} + ${y}) × ${z} = ?`,'','Primero resuelve lo que hay entre paréntesis.','mul',(x+y)*z):mk(`${x} × ${y} + ${z} = ?`,'','Primero la multiplicación, luego la suma.','mul',x*y+z)}
function oper(a,m){const l=[[sum,rest],[sum,rest,mul,div],[sum,rest,mul,div,frac,comb]][a];return P(l)(a,m)}
function agr(a,m){const[e,n]=P(EM);let x,y,sub=a==2&&R(0,1);if(a==0){x=R(2,6);y=R(1,10-x)}else if(a==1){x=R(3,mx(14,m));y=R(2,mx(10,m))}else{x=R(15,mx(35,m));y=R(3,x-3)}
if(sub)return mk(`Hay ${x} ${n}. Se van ${y}. ¿Cuántas quedan?`,em(e,x),'Quita las que se van y cuenta.','rest',x-y);
return mk(`Hay ${x} ${n}. Si añadimos ${y} más, ¿cuántas hay?`,em(e,x)+'<b>➕</b>'+em(e,y),'Cuenta todas juntas.','sum',x+y)}
function cont(a,m){const[e,n,q]=P(EM),c=a==0?Math.min(10,R(1,mx(10,m))):a==1?R(5,mx(50,m)):R(20,mx(90,m));return mk(`¿${q} ${n} hay?`,em(e,c),'Fíjate en los grupos de 5 y cuenta de 5 en 5.','log',c)}
function falta(a,m){const st=a==0?P([1,1,2]):a==1?P([2,5,10,3]):P([3,4,6,7,25,9,-5,-10]),s0=st<0?R(40,mx(90,m)):R(0,a==0?8:20),ar=[0,1,2,3,4].map(i=>s0+st*i),k=R(0,4),r=mk('¿Qué número falta?',`<div class=big>${ar.map((n,i)=>i==k?'<b class=hole>❓</b>':`<span class=nb>${n}</span>`).join('')}</div>`,`Mira cuánto ${st>0?'sube':'baja'} cada vez: ${Math.abs(st)}.`,'log',ar[k]);return r}
function comp(a,m){let x,y,vx,vy,h='Calcula cada lado y compara. La boca del signo se abre hacia el mayor.';if(a==0){x=R(1,10);y=R(0,4)?R(1,10):x;const e=P(EM)[0];vx=`<div class=grp>${e.repeat(x)}<br><b>${x}</b></div>`;vy=`<div class=grp>${e.repeat(y)}<br><b>${y}</b></div>`;h='Cuenta cada grupo: ¡el más grande tiene más!'}
else if(a==1){x=R(5,mx(50,m));y=R(0,6)?R(5,mx(50,m)):x;vx=x;vy=y}else{const p=R(2,9),q=R(2,9);x=p*q;y=x+P([-6,-2,0,2,6]);vx=`${p} × ${q}`;vy=y}
return{t:'¿Qué signo va en medio?',v:`<div class=big><span class=nb>${vx}</span><b class=hole>?</b><span class=nb>${vy}</span></div>`,h,c:'log',o:['<','=','>'],a:x>y?'>':x<y?'<':'='}}
const IT=[['🍎',1],['🍪',2],['🍌',1],['🥛',2],['🍫',3],['🧃',2],['🍦',3]],eur=n=>n+' €',fc=c=>(c%100?(c/100).toFixed(2).replace('.',','):c/100)+' €';
function shop(a,m){if(a<2){const n=a==0?2:P([2,3]),it=sh(IT).slice(0,n).map(([e,p])=>[e,a==0?p:p+R(0,3)]),tot=it.reduce((s,x)=>s+x[1],0);return mk(`Compras ${it.map(x=>x[0]).join(' y ')}. ¿Cuánto pagas?`,`<div class=big>${it.map(([e,p])=>`<span class=tag>${e} ${p} €</span>`).join('')}</div>`+(a==1&&tot<=20?`<div>${'🪙'.repeat(tot)}</div>`:''),`Suma los precios: ${it.map(x=>x[1]).join(' + ')}`,'prob',tot,eur,1)}
const t=R(0,2),e=P(IT)[0];if(t==0){const p=R(5,45)*10,q=R(5,45)*10;return mk('¿Cuánto pagas por los dos?',`<div class=big><span class=tag>${e} ${fc(p)}</span><span class=tag>${P(IT)[0]} ${fc(q)}</span></div>`,'Suma primero los euros y luego los céntimos.','prob',p+q,fc,10)}
if(t==1){const p=R(1,9)*50,pay=P([5,10]);return mk(`${e} cuesta ${fc(p)}. Pagas con ${pay} €. ¿Cuánto te devuelven?`,'',`Cuenta hacia arriba desde ${fc(p)} hasta ${pay} €.`,'prob',pay*100-p,fc,10)}
const p=P([20,40,60,80]),d=P([50,10]);return mk(`${e} cuesta ${p} € con ${d}% de descuento. ¿Cuánto pagas?`,'',d==50?'El 50% es la mitad.':'El 10% es dividir entre 10 y restarlo.','prob',p*(100-d),fc,100)}
const G=[{id:'dedos',n:'Sumas con dedos',i:'👋',k:'std',g:(a,m)=>sum(a,m,1)},{id:'agr',n:'Agrupar objetos',i:'🍎',k:'std',g:agr},{id:'cont',n:'Contar objetos',i:'🐸',k:'std',g:cont},{id:'falta',n:'¿Qué número falta?',i:'🎯',k:'std',g:falta},{id:'comp',n:'Mayor, menor o igual',i:'🐰',k:'std',g:comp},{id:'puz',n:'Puzzle de operaciones',i:'🧩',k:'std',g:oper,pz:1},{id:'space',n:'Viaje espacial',i:'🚀',k:'space',g:oper,n0:6},{id:'shop',n:'La tienda de mates',i:'🛒',k:'std',g:shop},{id:'mons',n:'Batalla contra el monstruo',i:'🐉',k:'mons',g:oper,n0:5},{id:'mem',n:'Memoria matemática',i:'🧠',k:'mem'},{id:'time',n:'Reto contrarreloj',i:'⏱️',k:'time',g:oper}];
const AG=[['🐣','5-6 años'],['🚀','7-8 años'],['🧠','9-10 años']];
const app=h=>{$('#app').innerHTML=h;scrollTo(0,0)};
/* pantallas */
function stop(){clearInterval(tk);if(cur&&cur.t0){S.time+=Math.round((Date.now()-cur.t0)/1000);save()}cur=null}
function home(){stop();bg();app(`<div class=mat id=mt onclick="surp()">${mati()}</div><div class=bubble>¡Hola! Soy Mati 🚀<br>¿Jugamos a las mates?</div><h2>¿Qué edad tienes?</h2>${AG.map((a,i)=>`<button class="btn age" onclick="pick(${i})" aria-label="${a[1]}">${a[0]} ${a[1]}</button>`).join('')}<div><button class=btn onclick="prog()">🏆 Mis logros</button><button class=btn onclick="gate()">⚙️ Adultos</button></div>`)}
function surp(){const m=P(['¡Sorpresa! Mati baila 💃','¡Eres genial! 🌟','¿Sabías que el 0 no es un número cualquiera? 🤓','¡Vamos a por más estrellas! ⭐']);const t=$('#toast');t.textContent=m;t.classList.add('on');say(m);setTimeout(()=>t.classList.remove('on'),2500)}
function pick(a){S.age=a;S.d=0;save();menu()}
function menu(){stop();app(`<div class=top><button class=ib onclick="home()" aria-label="Inicio">🏠</button><h2 style="flex:1;margin:0">Elige tu aventura</h2><span>⭐ ${S.stars}</span></div><p>${AG[S.age][0]} ${AG[S.age][1]}</p><div class=grid>${G.map((g,i)=>`<button class=card2 onclick="play(${i})"><span>${g.i}</span>${g.n}${S.gd[g.id]?' ✅':''}</button>`).join('')}</div><p><button class=btn onclick="prog()">🏆 Mis logros</button></p>`);say('Elige tu aventura')}
function play(i){stop();const g=G[i];cur={i,g,ok:0,streak:0,max:0,miss:0,q:0,t0:Date.now(),n:g.n0||10,tl:0};if(g.k=='mem')return mem();if(g.k=='time'){cur.tl=S.age?60:0;cur.left=60;if(cur.tl)tk=setInterval(()=>{cur.left--;const t=$('#tm');if(t)t.textContent='⏱️ '+cur.left;const b=$('.bar i');if(b)b.style.width=cur.left/60*100+'%';if(cur.left<=0)fin()},1000)}next()}
function next(){let q,t=0;do{q=cur.g.g(S.age,1+S.d*.3)}while(q.t+q.v==cur.last&&t++<9);cur.last=q.t+q.v;cur.cq=q;cur.tried=0;cur.lock=0;draw();say(q.t)}
function zone(){const g=cur.g,p=cur.q/cur.n*100;if(g.k=='mons')return`<div class=mon id=mon>👾</div><div class=hearts aria-label="Vidas del monstruo">${'❤️'.repeat(cur.n-cur.q)}</div>`;if(g.k=='space')return`<div class=track><span id=rk class=rk style="left:${p*.85}%">🚀</span><div class=stars>${'⭐'.repeat(cur.n-cur.q)}</div></div>`;return`<div class=mat style="font-size:4em">${mati()}</div>`}
function draw(){const q=cur.cq,pct=cur.tl?cur.left/60*100:cur.q/cur.n*100;app(`<div class=top><button class=ib onclick="menu()" aria-label="Volver al menú">🏠</button><div class=bar><i style="width:${pct}%"></i></div><span>⭐ ${cur.ok}</span><span>🔥 ${cur.streak}</span>${cur.tl?`<span id=tm>⏱️ ${cur.left}</span>`:''}</div><div class=zone>${zone()}</div><div class=q>${q.t.replace(/^(.*) = \?$/,cur.g.pz?'$1 = <b class=hole id=hole>?</b>':'$1 = ?')}</div><div class=vis>${q.v}</div><div class=opts>${q.o.map((o,k)=>`<button class=opt onclick="ans(${k})" aria-label="Respuesta ${esc(o)}"><small>${k+1}</small>${esc(o)}</button>`).join('')}</div><div class=fb id=fb aria-live=polite></div><button class=btn onclick="hint()">💡 Pista</button>`)}
function hint(){if(!cur||!cur.cq)return;$('#fb').textContent='💡 '+cur.cq.h;say(cur.cq.h)}
function ans(k){if(!cur||cur.lock)return;const q=cur.cq,b=document.querySelectorAll('.opt')[k],c=(S.cat[q.c]=S.cat[q.c]||[0,0]);
if(q.o[k]===q.a){cur.lock=1;b.classList.add('good');const h=$('#hole');if(h)h.textContent=q.o[k];snd.ok();if(!cur.tried){c[0]++;c[1]++;S.ok++;S.d=Math.min(1,S.d+.25);cur.streak++;cur.max=Math.max(cur.max,cur.streak)}S.stars++;cur.ok++;cur.q++;
let m=P(['¡Muy bien!','¡Genial!','¡Fantástico!','¡Eso es!']);if(!R(0,6))m='¡Sorpresa! Mati baila 💃';if(cur.streak&&cur.streak%5==0){m='🔥 ¡Racha de '+cur.streak+'!';confetti(50)}$('#fb').textContent=m;say(m.replace(/[^\p{L}\p{N}¡!¿? ]/gu,''));
if(cur.g.k=='mons'){$('#mon').classList.add('hit');$('#mon').textContent='💥';$('#fb').textContent='💥 ¡ZAS!'}if(cur.g.k=='space'){const r=$('#rk');if(r)r.style.left=cur.q/cur.n*85+'%'}
save();check();setTimeout(()=>{if(!cur)return;if(cur.g.k!='time'&&cur.q>=cur.n)fin();else next()},1100)}
else{b.classList.add('bad');b.disabled=true;snd.bad();if(!cur.tried){c[1]++;S.err++;cur.miss++;S.d=Math.max(-1,S.d-.35);cur.streak=0}cur.tried=1;const m=P(['¡Casi! Mira otra vez 👀','Buen intento 💪','Vamos a pensarlo juntos.']);$('#fb').textContent=m+'  💡 '+q.h;say(m.replace(/[^\p{L}¡!¿? .]/gu,'')+' '+q.h);save()}}
function fin(){clearInterval(tk);tk=0;const g=cur.g,s=Math.round((Date.now()-cur.t0)/1000);S.time+=s;S.games++;S.gd[g.id]=1;S.best=Math.max(S.best,cur.max);const r=g.k=='time'?Math.min(5,Math.max(1,Math.ceil(cur.ok/4))):Math.max(1,5-Math.min(4,cur.miss>>1)),i=cur.i,ok=cur.ok,mx2=cur.max;cur=null;save();
app(`<div style="font-size:4em">🎉</div><h2>${g.k=='mons'?'¡Has salvado el reino de las matemáticas!':g.k=='time'?'¡Tiempo! Has respondido '+ok+' 🎯':'¡Genial, lo has conseguido!'}</h2><div style="font-size:2.4em" aria-label="${r} estrellas de 5">${'⭐'.repeat(r)}${'☆'.repeat(5-r)}</div><p>Has conseguido ${ok} estrellas</p><p>🔥 Racha máxima: ${mx2}</p><button class=btn onclick="play(${(i+1)%G.length})">➡️ Siguiente juego</button><button class=btn onclick="menu()">🏠 Volver al menú</button><button class=btn onclick="play(${i})">🔄 Jugar otra vez</button>`);snd.win();confetti(140);say('¡Genial, lo has conseguido!');check()}
/* memoria */
function pair(a){let x,y;if(a==0){x=R(1,5);y=R(1,5);return[`${x}+${y}`,x+y]}if(a==1){if(R(0,1)){x=R(5,20);y=R(5,20);return[`${x}+${y}`,x+y]}x=R(2,5);y=R(2,6);return[`${x}×${y}`,x*y]}x=R(3,9);y=R(3,9);const t=R(0,2);return t==0?[`${x}×${y}`,x*y]:t==1?[`${x*y}÷${y}`,x]:[`${x*10}+${y*10}`,x*10+y*10]}
function mem(){const n=[4,6,8][S.age],ps=[],u=new Set();while(ps.length<n){const p=pair(S.age);if(!u.has(p[1])&&!ps.some(z=>z[0]==p[0])){u.add(p[1]);ps.push(p)}}
cur.n=n;cur.open=[];cur.found=0;const cs=sh(ps.flatMap((p,i)=>[{k:i,t:p[0]},{k:i,t:String(p[1])}]));
app(`<div class=top><button class=ib onclick="menu()" aria-label="Volver al menú">🏠</button><div class=bar><i style="width:0%"></i></div><span>⭐ 0</span></div><h2>Encuentra las parejas 🧠</h2><div class=mem>${cs.map((c,i)=>`<button class=mc data-k=${c.k} aria-label="Carta ${i+1}" onclick="flip(this)">❓</button>`).join('')}</div>`);
document.querySelectorAll('.mc').forEach((b,i)=>b.dataset.t=cs[i].t);say('Encuentra las parejas')}
function flip(b){if(!cur||b.classList.contains('up')||b.classList.contains('ok')||cur.open.length>1)return;b.classList.add('up');b.textContent=b.dataset.t;cur.open.push(b);tone(600,.1);if(cur.open.length<2)return;const[x,y]=cur.open;
if(x.dataset.k==y.dataset.k){[x,y].forEach(e=>{e.classList.remove('up');e.classList.add('ok')});cur.open=[];cur.found++;cur.ok++;cur.streak++;cur.max=Math.max(cur.max,cur.streak);S.stars++;snd.ok();$('.bar i').style.width=cur.found/cur.n*100+'%';$('.top span').textContent='⭐ '+cur.ok;save();check();if(cur.found==cur.n)setTimeout(fin,900)}
else{cur.miss++;cur.streak=0;snd.bad();setTimeout(()=>{if(!cur)return;[x,y].forEach(e=>{e.classList.remove('up');e.textContent='❓'});cur.open=[]},900)}}
/* progreso y adultos */
function prog(){stop();const C=[['sum','➕ Sumas'],['rest','➖ Restas'],['mul','✖️ Multiplicaciones'],['div','➗ Divisiones'],['log','🧩 Lógica'],['prob','🧮 Problemas']];
app(`<div class=top><button class=ib onclick="home()" aria-label="Inicio">🏠</button><h2 style="flex:1;margin:0">Mis logros</h2></div><div class=mat style="font-size:4em">${mati()}</div><div class=box>⭐ Estrellas totales: <b>${S.stars}</b><br>🏅 Logros: <b>${Object.keys(S.ach).length}/${A.length}</b><br>🎮 Juegos completados: <b>${S.games}</b><br>🔥 Mejor racha: <b>${S.best}</b></div><div class=box>${C.map(c=>{const v=(S.cat[c[0]]||[0])[0];return`${c[1]} (${v})<div class=pb><i style="width:${Math.min(100,v*2)}%"></i></div><br>`}).join('')}</div><div>${A.map(a=>`<div class="med ${S.ach[a[0]]?'':'lk'}">${a[1]}<br>${a[2]}${S.ach[a[0]]?'':' 🔒'}</div>`).join('')}</div>`)}
function gate(){const x=R(6,9),y=R(6,9),q=opts(x+y);app(`<div class=top><button class=ib onclick="home()" aria-label="Inicio">🏠</button></div><h2>⚙️ Zona de adultos</h2><div class=q>¿Cuánto es ${x} + ${y}?</div><div class=opts>${q.o.map(o=>`<button class=opt onclick="${o===q.a?'adults()':'home()'}">${o}</button>`).join('')}</div>`)}
function adults(){const t=S.ok+S.err,c=n=>S.cat[n]||[0,0],N={sum:'Sumas',rest:'Restas',mul:'Multiplicaciones',div:'Divisiones',log:'Lógica',prob:'Problemas'};
app(`<div class=top><button class=ib onclick="home()" aria-label="Inicio">🏠</button><h2 style="flex:1;margin:0">Progreso</h2></div><div class=box>⏱️ Tiempo de juego: <b>${Math.round(S.time/60)} min</b><br>🎮 Juegos completados: <b>${S.games}</b><br>✅ Aciertos a la primera: <b>${S.ok}</b><br>❌ Errores: <b>${S.err}</b><br>📈 Precisión: <b>${t?Math.round(S.ok/t*100):0}%</b><br>⭐ Estrellas: <b>${S.stars}</b></div><div class=box><b>Categorías practicadas</b><br>${Object.keys(N).map(k=>`${N[k]}: ${c(k)[0]} aciertos de ${c(k)[1]} intentos`).join('<br>')}</div><button class=btn onclick="if(confirm('¿Borrar todo el progreso?')){localStorage.removeItem('mati5');location.reload()}">🗑️ Borrar progreso</button>`)}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&cur)return menu();const k=+e.key;if(k>=1&&k<=4&&cur&&cur.cq){const b=document.querySelectorAll('.opt')[k-1];if(b&&!b.disabled)ans(k-1)}});
tg();bg();home();
</script></body></html>
